<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Refuge – démo 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.stats{font:600 12px/1.35 ui-monospace,Menlo,Consolas,monospace;background:rgba(8,14,26,.62);padding:7px 10px;border-radius:10px;backdrop-filter:blur(4px);white-space:pre}
.btns{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
.btns button{font:600 12px system-ui,sans-serif;color:#fff;background:rgba(8,14,26,.62);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:8px 11px;backdrop-filter:blur(4px);min-width:118px;text-align:left}
.btns button:active{background:rgba(60,90,140,.7)}
#stick{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.32);touch-action:none;z-index:5}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;bottom:calc(180px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(8,14,26,.8);padding:9px 14px;border-radius:10px;font:600 13px system-ui;opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center;z-index:6}
#toast.on{opacity:1}
#load{position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10;font:600 15px system-ui;transition:opacity .5s}
#load small{font-weight:400;opacity:.7}
.hint{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));font:500 12px system-ui;opacity:.65;text-align:right;pointer-events:none;z-index:4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="stats" id="stats">FPS –</div>
  <div class="btns">
    <button id="bQ" type="button">Qualité : Moyen</button>
    <button id="bV" type="button">Vue : 3e personne</button>
    <button id="bT" type="button">Heure : 16 h</button>
  </div>
</div>
<div id="stick"><div id="knob"></div></div>
<div class="hint">Glisse à droite pour regarder</div>
<div id="toast"></div>
<div id="load"><div>Le refuge du lac</div><small>Création du paysage…</small></div>
<script type="module" src="./main.js"></script>
</body>
</html>
